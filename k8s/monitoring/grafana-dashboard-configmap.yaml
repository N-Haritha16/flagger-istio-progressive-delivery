apiVersion: v1
kind: ConfigMap
metadata:
  name: progressive-delivery-dashboard
  namespace: progressive-delivery
  labels:
    grafana_dashboard: "1"
data:
  progressive-delivery.json: |
    {
      "title": "Progressive Delivery - Flagger + Istio",
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "type": "graph",
          "title": "Traffic split: primary vs canary",
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=\"demo-app-v1\",response_code!~\"5..\"}[1m]))",
              "legendFormat": "primary (v1)"
            },
            {
              "expr": "sum(rate(istio_requests_total{destination_workload=\"demo-app-v2\",response_code!~\"5..\"}[1m]))",
              "legendFormat": "canary/green (v2)"
            }
          ]
        },
        {
          "type": "graph",
          "title": "Request success rate",
          "targets": [
            {
              "expr": "100 * (sum(rate(istio_requests_total{reporter=\"destination\",response_code!~\"5..\",destination_workload=\"demo-app-v2\"}[1m])) / sum(rate(istio_requests_total{reporter=\"destination\",destination_workload=\"demo-app-v2\"}[1m])))",
              "legendFormat": "success rate v2"
            }
          ]
        },
        {
          "type": "graph",
          "title": "P99 latency (ms) v2",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_seconds_bucket{destination_workload=\"demo-app-v2\"}[5m])) by (le)) * 1000",
              "legendFormat": "p99 latency v2"
            }
          ]
        }
      ]
    }
