apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-v2
  namespace: progressive-delivery
  labels:
    app: demo-app
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
      version: v2
  template:
    metadata:
      labels:
        app: demo-app
        version: v2
    spec:
      containers:
        - name: demo-app
          image: harithanallamilli9702/demo-app:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "v2"
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: demo-app-canary-config
                  key: mode
            - name: FAULT_RATE
              valueFrom:
                configMapKeyRef:
                  name: demo-app-canary-config
                  key: fault_rate
            - name: EXTRA_LATENCY
              valueFrom:
                configMapKeyRef:
                  name: demo-app-canary-config
                  key: extra_latency
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
