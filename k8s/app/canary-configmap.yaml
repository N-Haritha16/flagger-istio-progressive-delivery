apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-canary-config
  namespace: progressive-delivery
data:
  # For successful canary, set mode=stable and low fault/latency
  # For failed canary, change to faulty and high values via separate script
  mode: "stable"
  fault_rate: "0.0"
  extra_latency: "0.0"
